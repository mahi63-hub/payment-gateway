<!DOCTYPE html>
<html>
<head>
  <title>Merchant Dashboard</title>
  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: linear-gradient(120deg, #eef2f3, #dfe9f3);
      padding: 40px;
    }

    h1 {
      margin-bottom: 20px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 420px;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #4338ca;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      text-align: center;
    }

    .stat {
      background: #f9fafb;
      padding: 15px;
      border-radius: 8px;
    }

    .label {
      font-size: 12px;
      color: #6b7280;
    }

    .value {
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h1>Merchant Dashboard</h1>

<form data-test-id="login-form" class="card">
  <input data-test-id="email-input" placeholder="Email" />
  <input data-test-id="password-input" placeholder="Password" type="password" />
  <button data-test-id="login-button" type="button" onclick="login()">Login</button>
</form>

<div id="dashboard" style="display:none">

  <div class="card" data-test-id="api-credentials">
    <p><b>API Key</b>: <span data-test-id="api-key">key_test_abc123</span></p>
    <p><b>API Secret</b>: <span data-test-id="api-secret">secret_test_xyz789</span></p>
  </div>

  <div class="card stats" data-test-id="stats-container">
    <div class="stat">
      <div class="label">Transactions</div>
      <div class="value" data-test-id="total-transactions">0</div>
    </div>
    <div class="stat">
      <div class="label">Total Amount</div>
      <div class="value" data-test-id="total-amount">?0</div>
    </div>
    <div class="stat">
      <div class="label">Success Rate</div>
      <div class="value" data-test-id="success-rate">0%</div>
    </div>
  </div>

</div>

<script>
function login(){
  document.querySelector("[data-test-id='login-form']").style.display="none";
  document.getElementById("dashboard").style.display="block";
}
</script>

</body>
</html>
