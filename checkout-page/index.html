<!DOCTYPE html>
<html>
<head>
  <title>Checkout</title>
  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: linear-gradient(120deg, #fdfbfb, #ebedee);
      padding: 40px;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      max-width: 420px;
      margin-bottom: 20px;
    }

    button {
      padding: 12px 16px;
      margin-right: 10px;
      border: none;
      border-radius: 6px;
      background: #16a34a;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
  </style>
</head>
<body>

<div data-test-id="checkout-container">

  <div class="box" data-test-id="order-summary">
    <h2>Complete Payment</h2>
    <p>Amount: <b data-test-id="order-amount">?500</b></p>
    <p>Order ID: <b data-test-id="order-id">order_demo</b></p>
  </div>

  <div class="box" data-test-id="payment-methods">
    <button data-test-id="method-upi" onclick="showUPI()">UPI</button>
    <button data-test-id="method-card" onclick="showCard()">Card</button>
  </div>

  <form class="box" data-test-id="upi-form" style="display:none">
    <input data-test-id="vpa-input" placeholder="username@bank" />
    <button data-test-id="pay-button">Pay</button>
  </form>

  <form class="box" data-test-id="card-form" style="display:none">
    <input data-test-id="card-number-input" placeholder="Card Number" />
    <input data-test-id="expiry-input" placeholder="MM/YY" />
    <input data-test-id="cvv-input" placeholder="CVV" />
    <input data-test-id="cardholder-name-input" placeholder="Name" />
    <button data-test-id="pay-button">Pay</button>
  </form>

</div>

<script>
function showUPI(){
  document.querySelector("[data-test-id='upi-form']").style.display="block";
  document.querySelector("[data-test-id='card-form']").style.display="none";
}
function showCard(){
  document.querySelector("[data-test-id='card-form']").style.display="block";
  document.querySelector("[data-test-id='upi-form']").style.display="none";
}
</script>

</body>
</html>
