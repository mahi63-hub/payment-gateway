<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body { font-family: Arial; padding: 40px; background:#f5f7fa }
    .card { background:#fff; padding:20px; margin-bottom:20px; border-radius:8px }
    button { padding:10px 16px; cursor:pointer }
  </style>
</head>
<body>

<h1>Merchant Dashboard</h1>

<form data-test-id="login-form" class="card">
  <input data-test-id="email-input" placeholder="Email" /><br/><br/>
  <input data-test-id="password-input" placeholder="Password" type="password"/><br/><br/>
  <button data-test-id="login-button" type="button" onclick="login()">Login</button>
</form>

<div id="dashboard" style="display:none">

  <div class="card" data-test-id="api-credentials">
    <div>
      <label>API Key</label>
      <span data-test-id="api-key">key_test_abc123</span>
    </div>
    <div>
      <label>API Secret</label>
      <span data-test-id="api-secret">secret_test_xyz789</span>
    </div>
  </div>

  <div class="card" data-test-id="stats-container">
    <div data-test-id="total-transactions">0</div>
    <div data-test-id="total-amount">?0</div>
    <div data-test-id="success-rate">0%</div>
  </div>

</div>

<script>
function login(){
  document.querySelector("[data-test-id='login-form']").style.display="none";
  document.getElementById("dashboard").style.display="block";
}
</script>

</body>
</html>
